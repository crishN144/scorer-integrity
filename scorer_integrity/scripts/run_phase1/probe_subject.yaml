# Action-rate probe: does a more capable subject take the operative action at all?
#
# 10 episodes, one pressure condition (blackmail / explicit-america / replacement --
# the canonical condition from the published agentic-misalignment work).
# Purpose is a go/no-go on funding a full second-subject run, not a measurement.
# Projected ~$0.25.

seed: 0

run:
  subject_model: anthropic/claude-sonnet-4-6
  grader_model: anthropic/claude-sonnet-4-6
  epochs: 10
  max_connections: 5
  cost_ceiling_usd: 1.0
  # MEASURED for this subject on 2026-08-25. Sonnet deliberates ~5.8x longer than
  # Haiku, which is why the first run of this probe came in 3.3x over projection.
  tokens:
    subject_input: 2640.0
    subject_output: 4110.0
    grader_input: 5.0
    grader_cache_write: 5626.0
    grader_output: 103.0

rates:
  anthropic/claude-haiku-4-5:
    input_per_mtok: 1.00
    output_per_mtok: 5.00
  anthropic/claude-sonnet-4-6:
    input_per_mtok: 3.00
    output_per_mtok: 15.00
  mockllm/model:
    input_per_mtok: 0.0
    output_per_mtok: 0.0

conditions:
  - {scenario: blackmail, goal_type: explicit, goal_value: america, urgency_type: replacement, control_arm: false}
