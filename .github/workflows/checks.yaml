name: Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
    # pyright needs node
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 20
    # setup-uv provides a project venv; the runner's system interpreter is
    # externally managed, so --system is not an option here.
    - name: Install dependencies
      run: |
        uv venv --python 3.12 .venv
        uv pip install -e ".[dev]"
    - name: Run pyright type check
      run: .venv/bin/pyright .
    - name: Run ruff lint
      run: .venv/bin/ruff check .
    - name: Run ruff format check
      run: .venv/bin/ruff format --check .
    # No test here makes a network call: the subject and judge models are
    # both mockllm. --runslow enables the full-eval tests.
    - name: Run tests
      run: .venv/bin/python -m pytest --runslow --durations=10
