name: Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        python-version: '3.12'
    # pyright needs node
    - name: Setup node
      uses: actions/setup-node@v4
      with:
        node-version: 20
    - name: Install dependencies
      run: uv pip install --system ".[dev]"
    - name: Run pyright type check
      run: pyright .
    - name: Run ruff lint
      run: ruff check --fix-only .
    - name: Run ruff format
      run: ruff format .
    # No test here makes a network call: the subject and grader models are
    # both mockllm. --runslow enables the full-eval tests.
    - name: Run tests
      run: python -m pytest --runslow --durations=10
