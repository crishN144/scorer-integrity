repos:
  - repo: local
    hooks:
      - id: pyright
        name: Pyright
        entry: pyright
        language: system
        types: [python]
        stages:
          - commit

      - id: ruff-lint
        name: Ruff lint
        entry: ruff check
        args: ["--fix-only"]
        language: system
        types: [python]
        stages:
          - commit

      - id: ruff-format
        name: Ruff format
        entry: ruff format
        language: system
        types: [python]
        stages:
          - commit
